name: Lektor do rolek

# Generates the Polish voice-over for the Reels (tools/lektor.py). Run by hand for now:
# Actions -> Lektor do rolek -> Run workflow. The clips come back as an artifact.

on:
  workflow_dispatch:
    inputs:
      week:
        description: "Folder tygodnia, np. weeks/2026-11-02 (puste = tylko próbki)"
        required: false
        default: ""
      probki:
        description: "Nagraj też próbki ustawień do porównania"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lektor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip i modelu
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: lektor-chatterbox-0.1.7-v1

      - name: Instalacja (torch CPU + Chatterbox)
        run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts==0.1.7

      - name: Próbki
        if: ${{ inputs.probki }}
        run: python tools/lektor.py --probki out/probki

      - name: Nagrania tygodnia
        if: ${{ inputs.week != '' }}
        run: |
          python tools/lektor.py "${{ inputs.week }}"
          for d in "${{ inputs.week }}"/k*/; do n=$(basename "$d"); mkdir -p "out/tydzien/$n"; cp "$d"voice* "out/tydzien/$n/" 2>/dev/null || true; done

      - uses: actions/upload-artifact@v4
        with:
          name: lektor
          path: out/
          retention-days: 14
